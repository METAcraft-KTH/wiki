name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/metacraft-kth/wiki:latest

  deploy:
    needs: build
    uses: itsektionen/rhyolite/.github/workflows/v1.yml@main
    secrets:
      RHYOLITE_TOKEN: ${{ secrets.RHYOLITE_TOKEN }}
    with:
      deploy-dir: metacraft-wiki
      command-name: docker-update
